{% extends "layout.html" %}

{% block main %}

<h2>Buy Stock</h2>

<form action="/buy" method="post" class="form-container">
    <div class="mb-3">
        <label for="symbol" class="form-label">Symbol</label>
        <input
            autocomplete="off"
            autofocus
            class="form-control"
            id="symbol"
            name="symbol"
            placeholder="AAPL"
            type="text"
            required
        >
    </div>

    <div class="mb-3">
        <label for="shares" class="form-label">Shares</label>
        <input
            class="form-control"
            id="shares"
            name="shares"
            min="1"
            placeholder="Number of shares"
            type="number"
            required
        >
    </div>

    <button class="btn btn-primary" type="submit">Buy</button>
</form>

{% endblock %}
