{% extends "layout.html" %}

{% block main %}

<h2>Log In</h2>

<form action="/login" method="post" class="form-container">
    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input
            autocomplete="off"
            autofocus
            class="form-control"
            id="username"
            name="username"
            type="text"
            required
        >
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
            class="form-control"
            id="password"
            name="password"
            type="password"
            required
        >
    </div>

    <button class="btn btn-primary" type="submit">Log In</button>
</form>

{% endblock %}
